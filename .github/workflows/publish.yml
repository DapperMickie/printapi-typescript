name: Publish to npm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      # Requires the npm trusted publisher documented in docs/publishing.md.
      # prepack runs all checks before uploading the package.
      - run: npm publish --access public
